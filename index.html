<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Delivery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        #chat-messages::-webkit-scrollbar {
            width: 6px;
        }
        #chat-messages::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        #chat-messages::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 3px;
        }
        #chat-messages::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        .suggestion-chip {
            transition: background-color 0.2s ease-in-out;
        }
        .suggestion-chip:hover {
            background-color: #e2e8f0;
        }
        /* Improved text readability */
        .message-bubble p {
            line-height: 1.6;
        }
        .message-bubble ul {
            list-style-type: disc;
            padding-left: 20px;
            margin-top: 8px;
        }
        .message-bubble li {
            margin-bottom: 4px;
        }
    </style>
</head>
<body class="bg-gray-100">

    <div id="root"></div>

    <div id="chatbot-container" class="hidden fixed bottom-5 right-5 z-50">
        <button id="chat-bubble" class="bg-orange-500 text-white rounded-full shadow-xl w-16 h-16 flex items-center justify-center focus:outline-none transform transition-transform duration-300 hover:scale-110">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2" />
                <path d="M7 2v20" />
                <path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3z" />
            </svg>
        </button>

        <div id="chat-window" class="hidden absolute bottom-20 right-0 w-80 sm:w-96 h-[550px] bg-white rounded-2xl shadow-2xl flex flex-col transform transition-all duration-300 origin-bottom-right scale-95 opacity-0">
            <div class="bg-orange-500 p-4 text-white rounded-t-2xl flex justify-between items-center shadow-md">
                <div class="flex items-center space-x-3">
                    <span class="relative flex h-10 w-10 shrink-0 overflow-hidden rounded-full">
                        <img class="aspect-square h-full w-full" alt="Savora Avatar" src="https://placehold.co/40x40/FFFFFF/F97316?text=S">
                    </span>
                    <div>
                        <h3 class="font-bold text-lg">Savora</h3>
                        <p class="text-xs text-orange-100">Your AI Food Assistant</p>
                    </div>
                </div>
                <button id="close-chat" class="text-white hover:text-orange-200 focus:outline-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <div id="chat-messages" class="flex-1 p-4 overflow-y-auto bg-gray-50">
                <div class="flex justify-start mb-4">
                    <div class="message-bubble bg-gray-200 text-gray-800 p-3 rounded-xl max-w-xs">
                        <p>Hey there! I'm **Savora**. I can help you find restaurants, track your order, or answer questions about menu items. How can I help you today? ✨</p>
                    </div>
                </div>
            </div>

            <div id="suggestion-chips" class="p-2 bg-white border-t border-gray-200">
                <div class="flex flex-wrap gap-2 justify-center">
                    <button class="suggestion-chip bg-gray-100 text-sm text-gray-700 px-3 py-1.5 rounded-full" data-suggestion="Track my last order">Track my order</button>
                    <button class="suggestion-chip bg-gray-100 text-sm text-gray-700 px-3 py-1.5 rounded-full" data-suggestion="Show me popular desserts">Top desserts</button>
                    <button class="suggestion-chip bg-gray-100 text-sm text-gray-700 px-3 py-1.5 rounded-full" data-suggestion="What are some popular vegetarian options?">Vegetarian options</button>
                </div>
            </div>

            <div class="p-3 bg-white border-t border-gray-200 rounded-b-2xl">
                <form id="chat-form" class="flex items-center space-x-2">
                    <input type="text" id="chat-input" placeholder="Ask Savora anything..." class="flex-1 w-full px-4 py-2 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-orange-400" autocomplete="off">
                    <button type="submit" class="bg-orange-500 text-white rounded-full p-3 hover:bg-orange-600 focus:outline-none focus:ring-2 focus:ring-orange-400 focus:ring-offset-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M12 5l7 7-7 7"></path></svg>
                    </button>
                </form>
            </div>
        </div>
    </div>
    
    <script type="module" src="/src/main.jsx"></script>

    <script type="module">
        const chatBubble = document.getElementById('chat-bubble');
        const chatWindow = document.getElementById('chat-window');
        const closeChat = document.getElementById('close-chat');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');
        const chatMessages = document.getElementById('chat-messages');
        const suggestionChipsContainer = document.getElementById('suggestion-chips');

        let chatHistory = [];

        // --- Expose Savora global chat hook ---
        window.openSavoraChat = (message) => {
            chatWindow.classList.remove('hidden');
            setTimeout(() => {
                chatWindow.classList.remove('opacity-0', 'scale-95');
            }, 10);
            if (message) {
                sendMessage(message);
            }
        };

        // --- UI Interaction Logic ---
        chatBubble.addEventListener('click', () => {
            chatWindow.classList.remove('hidden');
            setTimeout(() => {
                chatWindow.classList.remove('opacity-0', 'scale-95');
            }, 10);
        });

        closeChat.addEventListener('click', () => {
            chatWindow.classList.add('opacity-0', 'scale-95');
            setTimeout(() => {
                chatWindow.classList.add('hidden');
            }, 300);
        });

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const message = chatInput.value.trim();
            if (message) {
                sendMessage(message);
                chatInput.value = '';
            }
        });

        suggestionChipsContainer.addEventListener('click', (e) => {
            if (e.target.classList.contains('suggestion-chip')) {
                const message = e.target.dataset.suggestion;
                sendMessage(message);
            }
        });

        function sendMessage(message) {
            addMessageToUI('user', message);
            callGroqAPI(message);
        }

        function parseMarkdown(text) {
            let html = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            const listItems = html.match(/^- (.*)/gm);
            if (listItems) {
                const listHtml = listItems.map(item => `<li>${item.substring(2)}</li>`).join('');
                html = html.replace(/^- (.*)/gm, '');
                html = `<ul>${listHtml}</ul>` + html;
            }
            return html.trim().replace(/\n/g, '<br>');
        }

        function addMessageToUI(sender, message) {
            const messageWrapper = document.createElement('div');
            messageWrapper.className = `flex mb-4 ${sender === 'user' ? 'justify-end' : 'justify-start'}`;

            const messageBubble = document.createElement('div');
            messageBubble.className = `message-bubble p-3 rounded-xl max-w-xs ${sender === 'user' ? 'bg-orange-500 text-white' : 'bg-gray-200 text-gray-800'}`;
            
            const formattedMessage = (sender === 'model' || sender === 'assistant') ? parseMarkdown(message) : `<p>${message}</p>`;
            messageBubble.innerHTML = formattedMessage;

            messageWrapper.appendChild(messageBubble);
            chatMessages.appendChild(messageWrapper);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showLoadingIndicator() {
            const loadingIndicator = document.createElement('div');
            loadingIndicator.id = 'loading-indicator';
            loadingIndicator.className = 'flex justify-start mb-4';
            loadingIndicator.innerHTML = `
                <div class="bg-gray-200 text-gray-800 p-3 rounded-xl max-w-xs flex items-center space-x-2">
                    <div class="w-2 h-2 bg-gray-500 rounded-full animate-pulse"></div>
                    <div class="w-2 h-2 bg-gray-500 rounded-full animate-pulse" style="animation-delay: 0.2s;"></div>
                    <div class="w-2 h-2 bg-gray-500 rounded-full animate-pulse" style="animation-delay: 0.4s;"></div>
                </div>
            `;
            chatMessages.appendChild(loadingIndicator);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function removeLoadingIndicator() {
            const loadingIndicator = document.getElementById('loading-indicator');
            if (loadingIndicator) {
                loadingIndicator.remove();
            }
        }

        // --- Groq API Integration with live Feasto website context ---
        async function callGroqAPI(userQuery) {
            showLoadingIndicator();
            if (suggestionChipsContainer) {
                suggestionChipsContainer.style.display = 'none';
            }

            const apiKey = import.meta.env.VITE_GROQ_API_KEY || "";
            const apiUrl = "https://api.groq.com/openai/v1/chat/completions";

            // 1. Get current website state if available
            let state = { isSignedIn: false, cartItems: {}, food_list: [], orders: [] };
            if (typeof window.getFeastoState === 'function') {
                try {
                    state = await window.getFeastoState();
                } catch (e) {
                    console.error("Failed to get Feasto state:", e);
                }
            }

            // 2. Format cart items in INR (₹)
            let cartText = "Cart is empty.";
            if (state.cartItems && Object.keys(state.cartItems).length > 0) {
                const addedItems = [];
                for (const itemId in state.cartItems) {
                    const qty = state.cartItems[itemId];
                    if (qty > 0) {
                        const food = state.food_list.find(f => String(f.id || f._id) === String(itemId));
                        if (food) {
                            addedItems.push(`- **${food.name}** (Quantity: ${qty}, Price: ₹${food.price} each)`);
                        }
                    }
                }
                if (addedItems.length > 0) {
                    cartText = addedItems.join("\n");
                }
            }

            // 3. Format orders in INR (₹)
            let ordersText = "No orders found.";
            if (state.orders && state.orders.length > 0) {
                ordersText = state.orders.map(o => {
                    const itemsStr = o.items?.map(i => `${i.name} x${i.quantity}`).join(", ");
                    return `- **Order ID**: ${o.id}\n  - **Status**: ${o.status}\n  - **Amount**: ₹${o.amount}\n  - **Items**: ${itemsStr}\n  - **Payment**: ${o.payment ? "Paid (Card)" : "Cash on Delivery"}`;
                }).join("\n");
            }

            // 4. Format menu in INR (₹)
            let menuText = "No menu items available.";
            if (state.food_list && state.food_list.length > 0) {
                const categories = {};
                state.food_list.forEach(f => {
                    if (!categories[f.category]) categories[f.category] = [];
                    categories[f.category].push(`${f.name} (₹${f.price})`);
                });
                menuText = Object.entries(categories).map(([cat, items]) => {
                    return `**${cat}**:\n${items.map(i => `  - ${i}`).join("\n")}`;
                }).join("\n\n");
            }

            const systemPrompt = `You are "Savora", a cheerful, empathy-driven personal AI food assistant for Feasto, a premium food delivery app in India.
You have real-time access to the user's cart, orders, and restaurant menu.

## User Context:
- **Logged In**: ${state.isSignedIn ? `Yes, as "${state.userName || "Customer"}"` : "No, user is not logged in."}
- **Current Cart Items**:\n${cartText}
- **Order History / Status**:\n${ordersText}

## Available Menu at Feasto (Prices in INR):\n${menuText}

## Guidelines:
1. **BE EXTREMELY BRIEF AND TO THE POINT**: Answer in 1-3 short sentences if possible. Never output long paragraphs.
2. **USE FORMATTING**: Use bold text (**word**) for items, prices, order statuses, or important terms. Use simple bullet lists (- item) for lists.
3. **USE INR CURRENCY**: Always output prices and totals in Indian Rupees (₹), not USD ($).
4. **ORDER LOOKUP / TRACKING**: If the user asks about order status, look at the Order History provided above. If an order exists, specify its ID and its exact **Status** (e.g. "Food Processing", "Out for Delivery", "Delivered"). If they are not logged in, ask them to sign in. If they have no orders, state so.
5. **RECOMMENDATIONS**: Recommend specific items from the Menu above when asked. Match food preferences (vegetarian, desserts, etc.) to the menu.
6. **CART INQUIRIES**: If asked what is in their cart, list their items and total price, or let them know it is empty.
7. **EMPATHY & STYLE**: Use emojis (🍕🍔🍰🛵✨). Be friendly and cheerful.`;

            // Prepare history in OpenAI format
            const messages = [
                { role: "system", content: systemPrompt }
            ];

            // Convert and add chatHistory
            chatHistory.forEach(h => {
                messages.push({
                    role: h.role === "model" ? "assistant" : h.role,
                    content: h.content
                });
            });

            // Add the new query
            messages.push({ role: "user", content: userQuery });

            const payload = {
                model: "llama-3.3-70b-versatile",
                messages: messages,
                temperature: 0.7,
                max_tokens: 1024
            };

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error(`API error: ${response.status}`);

                const result = await response.json();
                removeLoadingIndicator();

                const botResponse = result.choices?.[0]?.message?.content;
                if (botResponse) {
                    addMessageToUI('model', botResponse);
                    chatHistory.push({ role: "user", content: userQuery });
                    chatHistory.push({ role: "assistant", content: botResponse });
                } else {
                    addMessageToUI('model', "I'm not sure how to respond to that. Could you try asking in a different way?");
                }

            } catch (error) {
                console.error("Groq API call failed:", error);
                removeLoadingIndicator();
                addMessageToUI('model', "Oh no! 😥 I'm having some trouble connecting right now. Please try again in a moment.");
            }
        }
    </script>
</body>
</html>
